- name: varta
  type: tcp
  host: 192.168.178.23   # IP deiner Varta
  port: 502
  delay: 3
  timeout: 10
  retries: 5
  message_wait_milliseconds: 2000
  scan_interval: 120  # Nur alle 2 Minuten Werte abfragen, um Kollision mit Solarwatt Energy Manager zu vermeiden
