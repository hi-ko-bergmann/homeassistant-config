- name: kaco
  type: tcp
  host: 192.168.178.35   # Kaco blueplanet 10.0NX3 (SN: 12077639)
  port: 502
  delay: 1
  timeout: 5
  retries: 3
  scan_interval: 60  # Erhöht auf 60 Sekunden für schnelleren Start
  sensors:
### Raw AC Power Value (Register 40084)
    - name: mb_kaco_ac_power_raw
      unique_id: kaco_ac_power_raw
      slave: 3
      address: 40084
      data_type: uint16
### AC Power Scale Factor (Register 40085)
    - name: mb_kaco_ac_power_sf
      unique_id: kaco_ac_power_sf
      slave: 3
      address: 40085
      data_type: int16
### Raw Total Energy Value (Register 40094)
