- id: '1767470950100'
  alias: Tibber Strompreis Reload
  description: Lädt Tibber Integration neu wenn Strompreis länger als 5 Min unavailable. Prüft alle 5 Minuten ob Sensor unavailable ist.
  triggers:
    - trigger: time_pattern
      minutes: "/5"
  conditions:
    - condition: state
      entity_id: sensor.myhome_strompreis
      state: unavailable
      for:
        minutes: 5
  actions:
    - action: homeassistant.reload_config_entry
      data:
        entry_id: 01KMDR80A1XYHV165K24S86W4P
  mode: single
